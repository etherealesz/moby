[project]
name = "backend"
version = "0.0.1"
description = "backend description"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.17.2",
    "fastapi-injector>=0.9.0",
    "fastapi[standard]>=0.126.0",
    "google-cloud-storage>=3.7.0",
    "greenlet>=3.3.0",
    "hatchling>=1.28.0",
    "httpx>=0.28.1",
    "networkx>=3.6.1",
    "osmnx>=2.1.0",
    "psycopg[binary]>=3.3.2",
    "python-injector>=0.2",
    "scikit-learn>=1.9.0",
    "sqlalchemy>=2.0.45",
    "tenacity>=9.1.2",
]

[dependency-groups]
deployment = [
    "granian>=2.7.2",
    "sentry-sdk[fastapi]>=2.48.0",
]
dev = [
    "pre-commit>=4.5.1",
    "ruff>=0.14.10",
]
test = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "respx>=0.22.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
  "src/app",
  "src/commands",
  "src/container",
  "src/core",
  "src/infrastructures",
  "src/modules",
]

[tool.uv]
package = true

[tool.ruff]
line-length = 90
extend-exclude = [
    ".git",
    "__pycache__",
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
    "venv",
    "k8s",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending= "lf"
skip-magic-trailing-comma = false

[tool.pytest.ini_options]
testpaths = "tests"
python_files = "test_*.py"
asyncio_mode="auto"
asyncio_default_fixture_loop_scope="function"
